# WebATLAS login theme (K6). Parent is `base`: plain markup and no PatternFly, so login.css is the only
# stylesheet and every class below is one it defines. template.ftl and login.ftl are overridden; the
# other pages (error, info, logout, page expired, update password/profile) keep base's markup and pick
# up these classes.
parent=base
locales=vi,en

styles=css/login.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=wa-kc
kcBodyClass=wa-kc__body

kcFormGroupClass=wa-field
kcFormSettingClass=wa-options
kcLabelClass=wa-label
kcLabelWrapperClass=wa-label-wrap
kcInputWrapperClass=wa-input-wrap
kcInputClass=wa-input
kcInputGroup=wa-input-group
kcInputErrorMessageClass=wa-field-error
kcInputHelperTextBeforeClass=wa-hint
kcInputHelperTextAfterClass=wa-hint
kcCheckboxInputClass=wa-checkbox
kcContentWrapperClass=wa-content

kcFormButtonsClass=wa-actions
kcFormButtonsWrapperClass=wa-actions
kcFormOptionsClass=wa-options
kcFormOptionsWrapperClass=wa-options

kcButtonClass=wa-btn
kcButtonPrimaryClass=wa-btn--primary
kcButtonDefaultClass=wa-btn--secondary
kcButtonBlockClass=wa-btn--block
kcButtonLargeClass=

kcAlertClass=wa-alert
kcAlertTitleClass=wa-alert__text

# Base's password toggle (passwordVisibility.js) swaps these on an <i> and rewrites the button's
# aria-label; login.css shows that label as the button's text, so no icon font is needed.
kcFormPasswordVisibilityButtonClass=wa-reveal
kcFormPasswordVisibilityIconShow=wa-reveal__icon
kcFormPasswordVisibilityIconHide=wa-reveal__icon

kcSignUpClass=wa-info
kcInfoAreaWrapperClass=wa-info
