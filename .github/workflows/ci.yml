name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run test:shared

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run lint:web
      - run: npm run build:web
      - run: npm run test:web

  # Sổ đăng ký dữ liệu. Chạy KHÔNG có DATABASE_URL, Docker hay GeoServer: các kiểm thử cần
  # những thứ đó tự bỏ qua (skipIf), phần còn lại (runner, descriptor, probe, fetch-http, các
  # script công bố chạy với curl giả) không phụ thuộc dữ liệu. Trước đây gói này không có
  # trong CI, nên một thay đổi làm hỏng atlas:up vẫn merge được.
  atlas-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npx tsc -p packages/atlas-data/tsconfig.json --noEmit
      - run: npm run test -w @webatlas/atlas-data

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: webatlas
          POSTGRES_PASSWORD: webatlas
          POSTGRES_DB: webatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webatlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://webatlas:webatlas@localhost:5432/webatlas
      JWT_SECRET: ci_dummy_secret_at_least_16_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run migrate
      - run: npm run seed
      # Bước 4 của docs/runbooks/README.md — đánh dấu BẮT BUỘC, và dữ liệu nguồn nằm
      # trong git, nhưng CI trước nay bỏ qua. Thiếu nó thì riverOverview.test.ts và
      # data.test.ts chạy trên bảng rỗng; tệ hơn, kết quả còn đổi theo việc suite nào
      # tình cờ chạy trước, vì integration.test.ts cũng nạp sông trong lúc kiểm thử.
      #
      # Gọi qua -w: package.json ở gốc không có script này (khác migrate/seed).
      - run: npm run ingest:rivers -w @webatlas/api
      # Bản đồ nền thật cần bản trích Geofabrik 720 MB nên CI không dựng được. Thay vào đó nạp
      # fixture đã commit (mọi đối tượng có tên của sáu tỉnh, packages/atlas-data/fixtures/basemap),
      # dựng thực thể tham chiếu như atlas:up vẫn làm, rồi đối chiếu với digest lấy từ atlas thật:
      # nếu thực thể dựng từ fixture khác atlas thật thì dừng ở đây, trước khi kiểm thử chạy.
      - run: python3 packages/atlas-data/tools/fixtures/basemap_fixture.py load
      - run: npm run reference:build -w @webatlas/api
      - run: python3 packages/atlas-data/tools/fixtures/basemap_fixture.py verify
      # Lõi phiên bản nằm ở packages/versioning; kiểm thử của nó dùng chung cơ sở dữ liệu này
      # (đã migrate, seed và nạp sông ở các bước trên), nên chạy ngay trong job api.
      - run: npx tsc -p packages/versioning/tsconfig.json --noEmit
      - run: npm run test:versioning
      # Bộ nạp load-geojson và việc tiếp nhận phiên bản cũ: kiểm thử cần cơ sở dữ liệu thật, chạy
      # trong transaction rồi rollback. Chỉ hai tệp này: phần còn lại của atlas-data chạy ở job riêng.
      - run: npx vitest run src/stages/loadGeojson.db.test.ts src/adoptLegacy.db.test.ts
        working-directory: packages/atlas-data
      - run: npx tsc -p apps/api/tsconfig.json --noEmit
      - run: npm run test:api
