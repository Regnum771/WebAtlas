name: webatlas

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgis/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      # Allow the browser frontend (Vite dev server / deployed origin) to fetch WFS.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data

  # Tooling for the dataset registry's `tools` stages (spec §7). Never started by a plain
  # `docker compose up`: the profile keeps it out until the runner asks for it with
  # `docker compose --profile tools run --rm -T --no-deps tools <argv>`.
  tools:
    profiles: ["tools"]
    build:
      context: ../packages/atlas-data/tools
    image: webatlas-atlas-tools
    working_dir: /repo
    volumes:
      - ..:/repo
    environment:
      # `run -T` gives Python a pipe, which it block-buffers: without this a long load prints
      # nothing until it exits, and only the runner's heartbeat shows it is alive.
      PYTHONUNBUFFERED: "1"
      # In-network addresses (spec C-11): inside the network the database is `db:5432`, not localhost.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BASEMAP_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_WORKSPACE: webatlas
      GEOSERVER_DB_HOST: db
      GEOSERVER_DB_PORT: "5432"
      GEOSERVER_DB_NAME: ${POSTGRES_DB}
      GEOSERVER_DB_USER: ${POSTGRES_USER}
      GEOSERVER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Time series (packages/atlas-data/tools/timeseries): the same env as the worker below, so
      # the live check can publish from here.
      TIMESERIES_DIR: /repo/var/timeseries
      GEOSERVER_TIMESERIES_DIR: /webatlas-timeseries
      TIMESERIES_INDEX_DB_HOST: db
      TIMESERIES_INDEX_DB_PORT: "5432"
      TIMESERIES_INDEX_DB_NAME: webatlas_mosaic_index
      TIMESERIES_INDEX_DB_SCHEMA: public
      TIMESERIES_INDEX_DB_USER: webatlas_mosaic
      TIMESERIES_INDEX_DB_PASSWORD: ${MOSAIC_INDEX_DB_PASSWORD:-}
      # GeoNode bridge (timeseries/geonode_bridge.py), as the worker; the admin password only for
      # the live check's clean-up through GeoNode's API.
      GEONODE_BRIDGE_URL: http://django:8000
      WEBATLAS_BRIDGE_TOKEN: ${WEBATLAS_BRIDGE_TOKEN:-}
      GEONODE_ADMIN_PASSWORD: ${GEONODE_ADMIN_PASSWORD:-}

  # The workspace import/export worker (packages/atlas-data/tools/workspace/worker.py): claims the
  # jobs the API queues in workspace.jobs. Same image as `tools`. Behind its own profile, so a plain
  # `docker compose up` (and the test suites) never start it; run it with
  # `docker compose --profile worker up -d worker`.
  worker:
    profiles: ["worker"]
    build:
      context: ../packages/atlas-data/tools
    image: webatlas-atlas-tools
    working_dir: /repo
    volumes:
      - ..:/repo
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The file store the API writes uploads to and serves exports from (the repo's var/ via the mount).
      WORKSPACE_FILES_DIR: /repo/var/workspace-files
      # Time series: the worker writes ImageMosaic folders under TIMESERIES_DIR; GeoNode's GeoServer
      # (docker-compose.platform.yml) sees the same folder as GEOSERVER_TIMESERIES_DIR. The granule
      # index goes in its own database webatlas_mosaic_index (role webatlas_mosaic, which owns no
      # database: a GeoTools purge cannot drop it), reached as db:5432 from GeoServer too.
      TIMESERIES_DIR: /repo/var/timeseries
      GEOSERVER_TIMESERIES_DIR: /webatlas-timeseries
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      TIMESERIES_INDEX_DB_HOST: db
      TIMESERIES_INDEX_DB_PORT: "5432"
      TIMESERIES_INDEX_DB_NAME: webatlas_mosaic_index
      TIMESERIES_INDEX_DB_SCHEMA: public
      TIMESERIES_INDEX_DB_USER: webatlas_mosaic
      TIMESERIES_INDEX_DB_PASSWORD: ${MOSAIC_INDEX_DB_PASSWORD:-}
      # Registers published time series in GeoNode (timeseries/geonode_bridge.py, platform stack).
      GEONODE_BRIDGE_URL: http://django:8000
      WEBATLAS_BRIDGE_TOKEN: ${WEBATLAS_BRIDGE_TOKEN:-}
    command: ["python3", "packages/atlas-data/tools/workspace/worker.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  geoserver_data:
