name: webatlas

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgis/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      # Allow the browser frontend (Vite dev server / deployed origin) to fetch WFS.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data

  # Tooling for the dataset registry's `tools` stages (spec §7). Never started by a plain
  # `docker compose up`: the profile keeps it out until the runner asks for it with
  # `docker compose --profile tools run --rm -T --no-deps tools <argv>`.
  tools:
    profiles: ["tools"]
    build:
      context: ../packages/atlas-data/tools
    image: webatlas-atlas-tools
    working_dir: /repo
    volumes:
      - ..:/repo
    environment:
      # `run -T` gives Python a pipe, which it block-buffers: without this a long load prints
      # nothing until it exits, and only the runner's heartbeat shows it is alive.
      PYTHONUNBUFFERED: "1"
      # In-network addresses (spec C-11): inside the network the database is `db:5432`, not localhost.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BASEMAP_DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_WORKSPACE: webatlas
      GEOSERVER_DB_HOST: db
      GEOSERVER_DB_PORT: "5432"
      GEOSERVER_DB_NAME: ${POSTGRES_DB}
      GEOSERVER_DB_USER: ${POSTGRES_USER}
      GEOSERVER_DB_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  db_data:
  geoserver_data:
