; GeoNode's uwsgi.ini with a fixed, small worker pool. The stock file starts 16 workers and scales
; to 128, which alone would exhaust a 5.5 GB Docker VM.
[uwsgi]
http-socket = 0.0.0.0:8000
logto = /var/log/geonode.log
chdir = /usr/src/geonode/
module = geonode.wsgi:application
strict = false
master = true
enable-threads = true
vacuum = true
single-interpreter = true
die-on-term = true
need-app = true
thunder-lock = true
buffer-size = 32768
harakiri = 600
py-callos-afterfork = true
max-requests = 1000
max-worker-lifetime = 3600
reload-on-rss = 768
worker-reload-mercy = 60
processes = 2
threads = 4
