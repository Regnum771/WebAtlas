{% comment %}
  WebATLAS theme (K7). Overrides geonode_mapstore_client's snippet of the same name, which every GeoNode
  page includes after MapStore's geonode.css. webatlas-theme/geonode.css is generated by
  `npm run generate:theme` (packages/theme) and mounted as a template directory.
{% endcomment %}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
{% include "webatlas-theme/geonode.css" %}
</style>
<style>
    {% block extra_css %}
        {{ custom_theme.extra_css }}
    {% endblock %}
</style>
